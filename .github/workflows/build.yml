name: Rebuild dashboard

# Regenerates index.html whenever the data or template changes —
# including matches added from the site's "Add match" form.
on:
  push:
    branches: [main]
    paths:
      - matches.csv
      - ratings.json
      - template.html
      - build.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index.html
        run: python3 build.py

      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html"
          git pull --rebase
          git push
